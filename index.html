<title>Neon Gokart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap">
<style>
/* Single-look neon arcade: full-screen canvas, everything drawn in-canvas. */
:root{--bg:#07040d;--fg:#ffffff;color-scheme:dark}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;outline:none}
#probe{position:fixed;top:0;left:0;width:0;height:0;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);visibility:hidden;pointer-events:none}
</style>
<canvas id="c" tabindex="0" aria-label="Neon Gokart"></canvas>
<div id="probe"></div>
<script>
(()=>{'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d',{alpha:false});
const probe=document.getElementById('probe');
const FONT='"Russo One","Arial Black",Impact,sans-serif';
const RM=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
let W=1,H=1,DPR=1,INS={t:0,r:0,b:0,l:0};
function resize(){DPR=Math.min(window.devicePixelRatio||1,2.5);W=window.innerWidth;H=window.innerHeight;cv.width=Math.max(1,Math.round(W*DPR));cv.height=Math.max(1,Math.round(H*DPR));const cs=getComputedStyle(probe);INS={t:parseFloat(cs.paddingTop)||0,r:parseFloat(cs.paddingRight)||0,b:parseFloat(cs.paddingBottom)||0,l:parseFloat(cs.paddingLeft)||0};}
window.addEventListener('resize',resize);resize();
if(document.fonts&&document.fonts.load)document.fonts.load('24px "Russo One"').catch(()=>{});

const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const hsl=(h,s,l,a=1)=>`hsla(${((h%360)+360)%360},${s}%,${l}%,${a})`;
function angDiff(a,b){let d=(b-a)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d;}
function fmt(t){if(t==null||!isFinite(t))return '-:--.--';const m=Math.floor(t/60),s=t-m*60;return m+':'+(s<10?'0':'')+s.toFixed(2);}
const store={get(k,d){try{const v=localStorage.getItem('ngk_'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('ngk_'+k,JSON.stringify(v));}catch(e){}}};
const settings=Object.assign({music:true,sfx:true,bot:false,view:'fps',sky:'cyber'},store.get('settings',{}));
const records=store.get('records2',{})||{};

// racing line: the rival bot's lateral grip and braking (u/s²) set its speed through each corner
const BOT_LAT=1900,BOT_DEC=900;
//#TRACKS-BEGIN
const HW=75,STEP=10;
// Stylised layouts, clockwise, start/finish at the first point. len = real length (km) x ~1700 units.
const TRACK_DEFS=[
 {id:'monaco',name:'MONACO',sub:'CIRCUIT DE MONACO · 3.34 KM',hue:322,len:7125,pts:[[20,60],[28,54],[36,49],[42,47],[46,44],[50,38],[55,31],[60,25],[65,21],[71,21],[75,24],[77,30],[76,36],[72,39],[70,43],[73,47],[78,49],[82,53],[82,59],[78,63],[70,65],[60,66],[52,66],[48,69],[44,67],[38,68],[33,72],[29,70],[25,73],[19,75],[13,72],[12,66],[15,62]]},
 {id:'silverstone',name:'SILVERSTONE',sub:'GREAT BRITAIN · 5.89 KM',hue:158,len:12000,pts:[[84,30],[86,45],[86,58],[82,66],[76,72],[72,78],[66,80],[62,76],[58,72],[46,74],[34,76],[26,78],[20,74],[18,68],[20,60],[22,50],[28,42],[26,36],[32,30],[48,22],[64,16],[74,12],[80,14],[82,20],[80,26]]},
 {id:'monza',name:'MONZA',sub:'AUTODROMO NAZIONALE · 5.79 KM',hue:36,len:11750,pts:[[70,80],[55,80],[40,80],[24,80],[16,80],[12,77],[8,77],[4,70],[2,60],[3,50],[6,44],[9,42],[9,38],[12,30],[16,24],[22,20],[28,20],[32,24],[40,34],[48,42],[52,45],[55,50],[58,51],[66,54],[76,58],[84,62],[90,66],[93,72],[90,78],[84,80]]}
];
function buildTrack(d){
 let p=d.pts.map(a=>({x:a[0],y:a[1]}));
 for(let it=0;it<4;it++){const q=[];for(let i=0;i<p.length;i++){const a=p[i],b=p[(i+1)%p.length];q.push({x:a.x*.75+b.x*.25,y:a.y*.75+b.y*.25},{x:a.x*.25+b.x*.75,y:a.y*.25+b.y*.75});}p=q;}
 let L=0;for(let i=0;i<p.length;i++){const a=p[i],b=p[(i+1)%p.length];L+=Math.hypot(b.x-a.x,b.y-a.y);}
 const sc=d.len/L;p=p.map(v=>({x:v.x*sc,y:v.y*sc}));
 const P=[];let carry=0;
 for(let i=0;i<p.length;i++){const a=p[i],b=p[(i+1)%p.length];const sl=Math.hypot(b.x-a.x,b.y-a.y);let t=carry;while(t<sl){P.push({x:a.x+(b.x-a.x)*t/sl,y:a.y+(b.y-a.y)*t/sl});t+=STEP;}carry=t-sl;}
 const N=P.length,tx=new Float32Array(N),ty=new Float32Array(N),nx=new Float32Array(N),ny=new Float32Array(N),k=new Float32Array(N);
 for(let i=0;i<N;i++){const a=P[(i-1+N)%N],b=P[(i+1)%N];const dx=b.x-a.x,dy=b.y-a.y,l=Math.hypot(dx,dy)||1;tx[i]=dx/l;ty[i]=dy/l;nx[i]=-ty[i];ny[i]=tx[i];}
 for(let i=0;i<N;i++){const j1=(i-4+N)%N,j2=(i+4)%N;const cr=tx[j1]*ty[j2]-ty[j1]*tx[j2];k[i]=Math.asin(clamp(cr,-1,1))/(8*STEP);}
 const apex=[];
 for(let i=0;i<N;i++){const ak=Math.abs(k[i]);if(ak<1/320)continue;let ok=true;for(let o=-18;o<=18&&ok;o++){if(!o)continue;const v=Math.abs(k[(i+o+N)%N]);if(v>ak||(v===ak&&o<0))ok=false;}if(ok)apex.push({i,s:Math.sign(k[i])});}
 // racing line = an elastic band pulled tight inside the track: it cuts every corner at the apex
 const off=new Float32Array(N),olim=HW-16;
 for(const span of [48,30,18,10])for(let it=0;it<40;it++)for(let i=0;i<N;i++){const a=(i-span+N)%N,b=(i+span)%N;
  const mx=(P[a].x+nx[a]*off[a]+P[b].x+nx[b]*off[b])/2,my=(P[a].y+ny[a]*off[a]+P[b].y+ny[b]*off[b])/2;
  off[i]=clamp((mx-P[i].x)*nx[i]+(my-P[i].y)*ny[i],-olim,olim);}
 for(let it=0;it<12;it++){const o2=Float32Array.from(off);for(let i=0;i<N;i++)off[i]=(o2[(i-1+N)%N]+2*o2[i]+o2[(i+1)%N])/4;}
 const LX=new Float32Array(N),LY=new Float32Array(N),lds=new Float32Array(N),lh=new Float32Array(N),lk=new Float32Array(N),lv=new Float32Array(N);
 for(let i=0;i<N;i++){LX[i]=P[i].x+nx[i]*off[i];LY[i]=P[i].y+ny[i]*off[i];}
 for(let i=0;i<N;i++){const j=(i+1)%N,dx=LX[j]-LX[i],dy=LY[j]-LY[i];lds[i]=Math.max(1,Math.hypot(dx,dy));lh[i]=Math.atan2(dy,dx);}
 for(let i=0;i<N;i++){let sd=0;for(let o=-3;o<3;o++)sd+=lds[(i+o+N)%N];lk[i]=angDiff(lh[(i-3+N)%N],lh[(i+3)%N])/sd;}
 // bot speed profile: corner limit, then braking zones worked backwards from each corner
 for(let i=0;i<N;i++)lv[i]=Math.min(3000,Math.sqrt(BOT_LAT/Math.max(Math.abs(lk[i]),1e-5)));
 for(let pass=0;pass<2;pass++)for(let i=N-1;i>=0;i--){const j=(i+1)%N;lv[i]=Math.min(lv[i],Math.sqrt(lv[j]*lv[j]+2*BOT_DEC*lds[i]));}
 let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;for(const v of P){minX=Math.min(minX,v.x);minY=Math.min(minY,v.y);maxX=Math.max(maxX,v.x);maxY=Math.max(maxY,v.y);}
 return Object.assign({},d,{N,P,tx,ty,nx,ny,k,apex,off,LX,LY,lds,lh,lk,lv,minX,minY,maxX,maxY});
}
//#TRACKS-END
const TRACKS=TRACK_DEFS.map(buildTrack);
for(const T of TRACKS){const pa=new Path2D();pa.moveTo(T.P[0].x,T.P[0].y);for(let i=1;i<T.N;i++)pa.lineTo(T.P[i].x,T.P[i].y);pa.closePath();T.path=pa;
 const lp=new Path2D();lp.moveTo(T.LX[0],T.LY[0]);for(let i=1;i<T.N;i++)lp.lineTo(T.LX[i],T.LY[i]);lp.closePath();T.linePath=lp;}
const SLOTS=TRACKS.length+1; // last slot: future track

// ---------- tuning ----------
const LAPS=5,V0=520,ACC=700,BRAKE=1500,DT=1/120;
const A_GRIP=1350,LINE_GRIP=.7,BOT_SKILL=.93,ASSIST_STEP=.2,ASSIST_MIN=.4,A_DRIFT=2600,SCRUB=.55;   // tyre grip limit (u/s²), drift turning strength, speed scrubbed by the slide
const FLOW_GAIN=0.85,FLOW_TAU=40;           // vmax = V0*(1+0.85F), dF/dt=(1-F)/40 while clean
const LVL_AT=[0,0.5,1.3,2.3],LVLC=['#fff','#38d6ff','#ff9a1f','#ff3df0'];

// ---------- state ----------
const G={state:'title',t:0,sel:0,slide:0,overlay:null,toast:null,drawOv:false,swipe:null};
let R=null;
const UI=[];
const keys=new Set();
const ptr={left:null,right:null};
const uiU=()=>clamp(Math.min(W,H)/420,0.75,1.5);

// ---------- audio ----------
const A={C:null,beats:[],pulse:0,step:0,next:0,tr:0,E:null};
const mtof=m=>440*Math.pow(2,(m-69)/12);
function makeImpulse(C,sec){const len=Math.floor(C.sampleRate*sec),b=C.createBuffer(2,len,C.sampleRate);for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);}return b;}
function makeNoise(C){const len=C.sampleRate,b=C.createBuffer(1,len,C.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;return b;}
function initAudio(){
 if(A.C){if(A.C.state==='suspended')A.C.resume();return;}
 const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
 let C;try{C=new AC();}catch(e){return;}
 A.C=C;
 const comp=C.createDynamicsCompressor();comp.threshold.value=-16;comp.knee.value=12;comp.ratio.value=5;comp.attack.value=.004;comp.release.value=.2;comp.connect(C.destination);
 A.master=C.createGain();A.master.gain.value=.85;A.master.connect(comp);
 A.fx=C.createGain();A.fx.connect(A.master);
 A.rev=C.createConvolver();A.rev.buffer=makeImpulse(C,2.8);const rg=C.createGain();rg.gain.value=.5;A.rev.connect(rg);rg.connect(A.master);
 const fs=C.createGain();fs.gain.value=.18;A.fx.connect(fs);fs.connect(A.rev);
 A.noise=makeNoise(C);
 buildEngine();applySettings();
}
function applySettings(){if(!A.C)return;A.fx.gain.setTargetAtTime(settings.sfx?1:0,A.C.currentTime,.05);}
function env(g,t,peak,att,dec){g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(peak,t+att);g.gain.exponentialRampToValueAtTime(.0001,t+att+dec);}

// Engine = endless-rising Shepard-Risset glissando (the "always climbing" tension) filtered like an EV whine.
function buildEngine(){
 const C=A.C,E=A.E={phase:0,prev:[]};
 E.filter=C.createBiquadFilter();E.filter.type='lowpass';E.filter.frequency.value=600;E.filter.Q.value=2;
 E.out=C.createGain();E.out.gain.value=0;E.filter.connect(E.out);E.out.connect(A.fx);
 E.oscs=[];
 for(let k=0;k<6;k++){const o=C.createOscillator();o.type='triangle';const g=C.createGain();g.gain.value=0;o.connect(g);g.connect(E.filter);o.start();E.oscs.push({o,g});E.prev.push(k);}
 E.whine=C.createOscillator();E.whine.type='sine';E.wg=C.createGain();E.wg.gain.value=0;E.whine.connect(E.wg);E.wg.connect(A.fx);E.whine.start();
 E.ns=C.createBufferSource();E.ns.buffer=A.noise;E.ns.loop=true;E.nf=C.createBiquadFilter();E.nf.type='bandpass';E.nf.frequency.value=1800;E.nf.Q.value=4;E.ng=C.createGain();E.ng.gain.value=0;E.ns.connect(E.nf);E.nf.connect(E.ng);E.ng.connect(A.fx);E.ns.start();
}
function engineTick(dt){
 const E=A.E;if(!E)return;const t=A.C.currentTime;
 let on=0,sn=0,thr=0,drift=0,lvl=0;
 if(G.state==='race'&&R&&G.overlay!=='pause'){on=1;thr=R.thr;sn=Math.hypot(R.vx,R.vy)/V0;if(R.phase==='count')sn=R.thr*.45;if(R.phase==='finish')thr=.2;drift=R.drift?1:0;lvl=R.lvl;}
 E.phase=(E.phase+dt*(.03+.24*Math.min(2,sn)*(.4+.6*thr)))%6;
 for(let k=0;k<6;k++){const pos=(k+E.phase)%6,f=32*Math.pow(2,pos),w=Math.exp(-Math.pow(pos-3,2)/1.8);const os=E.oscs[k];
  if(pos<E.prev[k])os.o.frequency.setValueAtTime(f,t);else os.o.frequency.setTargetAtTime(f,t,.02);
  os.g.gain.setTargetAtTime(w*.16,t,.03);E.prev[k]=pos;}
 E.out.gain.setTargetAtTime(on*(.08+.22*thr+.14*Math.min(1.5,sn)),t,.06);
 E.filter.frequency.setTargetAtTime(350+2400*Math.min(1.6,sn)*(.5+.5*thr)+700*drift,t,.05);
 E.whine.frequency.setTargetAtTime(220+520*Math.min(2,sn),t,.05);E.wg.gain.setTargetAtTime(on*.022*Math.min(1.5,sn),t,.08);
 E.ng.gain.setTargetAtTime(on*drift*.05*Math.min(1,sn),t,.04);E.nf.frequency.setTargetAtTime(1500+500*lvl,t,.05);
}
function tone(type,f,t,v,d,f2){const C=A.C,os=C.createOscillator();os.type=type;os.frequency.setValueAtTime(f,t);if(f2)os.frequency.exponentialRampToValueAtTime(f2,t+d);const g=C.createGain();env(g,t,v,.004,d);os.connect(g);g.connect(A.fx);os.start(t);os.stop(t+d+.05);}
function noiseHit(t,type,f,f2,v,d,q=1){const C=A.C,s=C.createBufferSource();s.buffer=A.noise;const fl=C.createBiquadFilter();fl.type=type;fl.Q.value=q;fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+d);const g=C.createGain();env(g,t,v,.003,d);s.connect(fl);fl.connect(g);g.connect(A.fx);s.start(t,Math.random()*.4);s.stop(t+d+.05);}
function sBeep(f,d){if(!A.C)return;tone('square',f,A.C.currentTime,.12,d);}
function sClick(){if(!A.C)return;tone('sine',1250,A.C.currentTime,.12,.05);}
function sHit(imp){if(!A.C)return;const t=A.C.currentTime,v=.15+.4*Math.min(1,imp/250);noiseHit(t,'lowpass',900,200,v,.35);tone('sine',95,t,v,.3,35);}
function sBoost(L){if(!A.C)return;const t=A.C.currentTime;noiseHit(t,'bandpass',300,4200,.22+.06*L,.55,2);tone('sawtooth',110*L,t,.06,.5,440*L);}
function sApex(){if(!A.C)return;const t=A.C.currentTime;tone('sine',1568,t,.12,.6);tone('sine',2093,t+.06,.09,.6);}
function sCharge(L){if(!A.C)return;tone('square',[0,660,880,1175][L],A.C.currentTime,.07,.12);}
function sLap(){if(!A.C)return;const t=A.C.currentTime;[0,4,7,12].forEach((n,i)=>tone('triangle',mtof(74+n),t+i*.07,.14,.25));}

// ---------- race ----------
function newRace(ti){
 const T=TRACKS[ti],i0=4,rec=records[T.id]||{};
 R={T,ti,x:T.P[i0].x,y:T.P[i0].y,h:Math.atan2(T.ty[i0],T.tx[i0]),vx:0,vy:0,F:0,charge:0,lvl:0,drift:false,dDir:0,beta:0,boost:0,
  idx:i0,prog:i0,lapsDone:0,lapStart:0,time:0,laps:[],count:3.2,phase:'count',hitCool:0,cleanLap:true,shake:0,flash:0,
  trail:[],parts:[],pops:[],apexHit:new Set(),best:rec.lap==null?null:rec.lap,fin:0,total:0,newLap:false,newTotal:false,thr:0,st:0,br:false,hDir:0,holdT:0,onLine:0,place:0,bot:null,sts:0,wallGrip:0,assist:ASSIST_MIN,assistOn:0};
 if(settings.bot){R.x-=T.nx[i0]*24;R.y-=T.ny[i0]*24;R.bot={s:i0,s0:i0,lat0:24,v:0,F:0,slip:0,x:0,y:0,h:R.h,done:false,total:null};placeBot(0);}
 R.camA=R.h;R.camX=R.x;R.camY=R.y;R.fyaw=R.fyawP=R.h;R.px=R.x;R.py=R.y;
}
// rival bot: rides the racing line with the speed profile, drifting where the corner load is high
function placeBot(dt){
 const b=R.bot,T=R.T,N=T.N,i=Math.floor(b.s)%N,j=(i+1)%N,f=b.s-Math.floor(b.s);
 let bl=clamp(1-(b.s-b.s0)/80,0,1);bl=bl*bl*(3-2*bl);const lat=(b.lat0-T.off[i])*bl;
 b.x=T.LX[i]+(T.LX[j]-T.LX[i])*f+T.nx[i]*lat;b.y=T.LY[i]+(T.LY[j]-T.LY[i])*f+T.ny[i]*lat;
 const load=b.v*b.v*Math.abs(T.lk[i]),ts=Math.sign(T.lk[i])*clamp((load-1000)/900,0,1)*.45;
 b.slip+=(ts-b.slip)*Math.min(1,dt*5);b.h=T.lh[i]+b.slip;
}
function stepBot(dt){
 const b=R.bot,T=R.T;if(!b||R.phase==='count')return;
 const i=Math.floor(b.s)%T.N;
 b.F=Math.min(1,b.F+(1-b.F)/FLOW_TAU*dt);
 const tgt=b.done?0:Math.min(T.lv[i],V0*(1+FLOW_GAIN*b.F))*BOT_SKILL;
 b.v=b.v<tgt?Math.min(tgt,b.v+ACC*.9*dt):Math.max(tgt,b.v-BOT_DEC*1.4*dt);
 b.s+=b.v*dt/T.lds[i];
 if(!b.done&&b.s>=LAPS*T.N){b.done=true;b.total=R.time;}
 placeBot(dt);
 if(Math.abs(b.slip)>.15&&Math.random()<.7){const fx=Math.cos(b.h),fy=Math.sin(b.h),bx=Math.cos(T.lh[i])*b.v,by=Math.sin(T.lh[i])*b.v;
  for(const sd of [-1,1]){const aa=b.h+Math.PI+(Math.random()-.5)*.9,sp=60+Math.random()*120;spawn(b.x-fx*10-fy*8*sd,b.y-fy*10+fx*8*sd,Math.cos(aa)*sp+bx*.3,Math.sin(aa)*sp+by*.3,.35,'#fff',2.5);}}
}
function startRace(ti){newRace(ti);G.state='race';G.overlay=null;ptr.left=ptr.right=null;}
function pop(text,c='#fff',life=1.2){if(R)R.pops.push({text,c,life,max:life});}
function spawn(x,y,vx,vy,life,c,s){if(R.parts.length>500)return;R.parts.push({x,y,vx,vy,life,max:life,c,s});}
function updParts(dt){const ps=R.parts;for(let i=ps.length-1;i>=0;i--){const p=ps[i];p.life-=dt;if(p.life<=0){ps[i]=ps[ps.length-1];ps.pop();continue;}p.x+=p.vx*dt;p.y+=p.vy*dt;const d=1-dt*3;p.vx*=d;p.vy*=d;}}
// two-button controls: left half steers left, right half steers right, gas is automatic.
// Holding one side for HOLD_DRIFT seconds at speed starts a drift; letting go fires the boost.
const HOLD_DRIFT=.3;
function readInput(){
 const L=!!ptr.left||keys.has('arrowleft')||keys.has('a'),Rt=!!ptr.right||keys.has('arrowright')||keys.has('d');
 return{thr:1,st:(Rt?1:0)-(L?1:0),L,R:Rt};
}
function endDrift(reward){
 const r=R;if(!r.drift)return;const L=r.lvl;r.drift=false;r.lvl=0;r.charge=0;
 if(reward&&L>0){r.boost=[0,.5,.85,1.3][L];const fx=Math.cos(r.h),fy=Math.sin(r.h);r.vx+=fx*70*L;r.vy+=fy*70*L;r.F=Math.min(1,r.F+.015*L);
  pop(['','BOOST','SUPER BOOST','ULTRA BOOST'][L],LVLC[L]);sBoost(L);
  for(let i=0;i<14*L;i++){const a=r.h+Math.PI+(Math.random()-.5)*1.2,s=150+Math.random()*250;spawn(r.x-fx*12,r.y-fy*12,Math.cos(a)*s,Math.sin(a)*s,.5,LVLC[L],4);}}
}
// camera follows the road ahead, not the steering
// first-person yaw: follows the direction of travel blended with the road ahead, low-passed and rate-limited,
// so taps, drift slip and assist corrections never whip the view around
function fpsYaw(dt){const r=R,T=r.T,sp=Math.hypot(r.vx,r.vy),vd=sp>40?Math.atan2(r.vy,r.vx):r.h,a=T.P[(r.idx+6)%T.N],b=T.P[(r.idx+28)%T.N];

 {const sp=Math.hypot(r.vx,r.vy),j=(r.idx+6+Math.floor(sp/60))%T.N,ck=T.lk[(r.idx+10)%T.N];

 if(r.drift&&Math.random()<.8){const c=LVLC[r.lvl];for(const sd of [-1,1]){const wx=r.x-fx*10-fy*8*sd,wy=r.y-fy*10+fx*8*sd,aa=r.h+Math.PI+(Math.random()-.5)*.9,s=60+Math.random()*120;spawn(wx,wy,Math.cos(aa)*s+r.vx*.3,Math.sin(aa)*s+r.vy*.3,.35,c,r.lvl?3.5:2);}}

function slab(x,y,w,h,s,side,fill){ctx.beginPath();if(side==='l'){ctx.moveTo(x-s,y);ctx.lineTo(x+w,y);ctx.lineTo(x+w,y+h);ctx.lineTo(x,y+h);}else{ctx.moveTo(x,y);ctx.lineTo(x+w+s,y);ctx.lineTo(x+w,y+h);ctx.lineTo(x,y+h);}ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill();}}
function txt(s,x,y,size,align,color,shadow){ctx.font=`${size}px ${FONT}`;ctx.textAlign=align||'left';ctx.textBaseline='middle';if(shadow){ctx.fillStyle=shadow;ctx.fillText(s,x+size*.06,y+size*.06);}ctx.fillStyle=color||'#fff';ctx.fillText(s,x,y);}
function tw(s,size){ctx.font=`${size}px ${FONT}`;return ctx.measureText(s).width;}
function fit(s,size,maxW){const w=tw(s,size);return w>maxW?size*maxW/w:size;}
function button(x,y,w,h,label,fn,o={}){const s=o.slant==null?10:o.slant;slab(x,y,w,h,s,o.side||'r',o.fill||'rgba(0,0,0,.82)');if(o.stroke){ctx.strokeStyle=o.stroke;ctx.lineWidth=2;ctx.stroke();}

function poly(cx,cy,n,r,rot){ctx.beginPath();for(let i=0;i<n;i++){const a=rot+i*TAU/n;i?ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r):ctx.moveTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);}ctx.closePath();}

 {const n=Math.round(1/ASSIST_STEP),lv=Math.round(r.assist/ASSIST_STEP),pw=12*u;txt('ASSIST',bx-12*u,byy-44*u,11*u,'left',r.assistOn>.5?hsl(T.hue+180,100,75):'rgba(255,255,255,.55)');
  for(let i=0;i<n;i++)slab(bx+44*u+i*(pw+5*u),byy-48*u,pw,8*u,4*u,'r',i<lv?hsl(T.hue+180,100,65,.5+.5*r.assistOn):'rgba(255,255,255,.18)');}
 if(r.drift){const pw=26*u;for(let i=1;i<=3;i++){const px=W/2+(i-2)*(pw+8*u)-pw/2,py=byy-52*u;slab(px,py,pw,10*u,5*u,'r',r.lvl>=i?LVLC[i]:'rgba(255,255,255,.18)');}}
 // touch feedback
 for(const sd of [-1,1]){if(!(sd<0?ptr.left:ptr.right))continue;const ex=sd<0?INS.l+18*u:W-INS.r-18*u,cy=H*.55,c=r.drift&&r.dDir===sd?LVLC[r.lvl]:'rgba(255,255,255,.4)';
  ctx.strokeStyle=c;ctx.lineWidth=5*u;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(ex-sd*14*u,cy-22*u);ctx.lineTo(ex,cy);ctx.lineTo(ex-sd*14*u,cy+22*u);ctx.stroke();ctx.lineCap='butt';
  if(r.drift&&r.dDir===sd)txt('DRIFT',ex-sd*30*u,cy-38*u,12*u,'center','rgba(255,255,255,.75)');}
 // guides at the start
 if(r.phase==='count'||(r.lapsDone===0&&r.time<3)){const al=r.phase==='count'?.85:Math.max(0,1-r.time/3)*.85;
  ctx.strokeStyle=`rgba(255,255,255,${al*.25})`;ctx.setLineDash([8,10]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(W/2,H*.3);ctx.lineTo(W/2,H*.86);ctx.stroke();ctx.setLineDash([]);
  const gs=fit('HOLD LONGER = DRIFT',14*u,W*.42);
  txt('TAP = LEFT',W*.25,H*.6,gs,'center',`rgba(255,255,255,${al})`);txt('HOLD LONGER = DRIFT',W*.25,H*.6+20*u,gs,'center',`rgba(255,255,255,${al})`);
  txt('TAP = RIGHT',W*.75,H*.6,gs,'center',`rgba(255,255,255,${al})`);txt('LET GO = BOOST',W*.75,H*.6+20*u,gs,'center',`rgba(255,255,255,${al})`);
  txt('KEYS: A D / ← →',W/2,H*.6+50*u,fit('KEYS: A D / ← →',11*u,W-40),'center',`rgba(255,255,255,${al*.6})`);}
 // countdown
 if(r.phase==='count'){const nn=Math.ceil(r.count);if(nn<=3&&nn>0){const fr=nn-r.count,sz=96*u*(1.25-.25*fr);txt(String(nn),W/2,H*.34,sz,'center',`rgba(255,255,255,${1-fr*.6})`,hsl(T.hue,100,45));}}
 // popups
 let py=H*.28;for(const p of r.pops){const k=p.life/p.max,sz=(p.text==='GO!'?72:24)*u;ctx.globalAlpha=Math.min(1,k*2);txt(p.text,W/2,py-(1-k)*30*u,sz,'center',p.c,'rgba(0,0,0,.8)');ctx.globalAlpha=1;py+=sz*1.1;}
}
const SKIES=['cyber','sunset','off'],SKYN={cyber:'CYBER CITY',sunset:'SUNSET',off:'CLASSIC'};
function viewRow(bx,y,bw,bh,u){const half=(bw-12*u)/2,save=()=>store.set('settings',settings);
 button(bx,y,half,bh,'VIEW: '+(settings.view==='fps'?'FPS':'TOP'),()=>{settings.view=settings.view==='fps'?'top':'fps';save();},{size:fit('VIEW: FPS',15*u,half-24*u)});
 button(bx+half+12*u,y,half,bh,SKYN[settings.sky]||'CLASSIC',()=>{settings.sky=SKIES[(SKIES.indexOf(settings.sky)+1)%SKIES.length];save();},{size:fit('CYBER CITY',15*u,half-24*u)});}
function overlayPanel(title,hue){ctx.fillStyle='rgba(4,2,8,.74)';ctx.fillRect(0,0,W,H);const u=uiU(),ts=Math.min(40*u,W*.09),tW=tw(title,ts);const y=H*.2;slab(W/2-tW/2-30*u,y-ts*.7,tW+60*u,ts*1.4,ts*.4,'r','rgba(0,0,0,.9)');txt(title,W/2+ts*.2,y+1,ts,'center','#fff',hsl(hue,100,45));return y+ts*1.2;}
function renderOverlay(){
 G.drawOv=true;const u=uiU(),bw=Math.min(W-60,340*u),bh=48*u,gap=12*u,bx=W/2-bw/2,o=G.overlay;
 const hue=G.state==='race'&&R?R.T.hue:(G.state==='select'&&TRACKS[G.sel]?TRACKS[G.sel].hue:(G.t*14)%360);
 if(o==='settings'){let y=overlayPanel('SETTINGS',hue)+20*u;viewRow(bx,y,bw,bh,u);y+=bh+gap;
  button(bx,y,bw,bh,'ENGINE + FX: '+(settings.sfx?'ON':'OFF'),()=>{settings.sfx=!settings.sfx;store.set('settings',settings);applySettings();},{size:17*u,stroke:settings.sfx?hsl(hue,100,62):null});y+=bh+gap*2;
  button(bx,y,bw,bh,'BACK',()=>{G.overlay=null;},{size:17*u});}
 else if(o==='leaderboard'){let y=overlayPanel('LEADERBOARD',hue)+16*u;
  button(bx,y,bw,bh,'GOOGLE PLAY GAMES',()=>toast('COMING IN THE FINAL VERSION'),{size:fit('GOOGLE PLAY GAMES',16*u,bw-30*u)});y+=bh+gap;
  button(bx,y,bw,bh,'GAME CENTER (iOS)',()=>toast('COMING IN THE FINAL VERSION'),{size:fit('GAME CENTER (iOS)',16*u,bw-30*u)});y+=bh+gap*1.6;
  txt('YOUR RECORDS',W/2,y,13*u,'center',hsl(hue,100,75));y+=22*u;
  for(const T of TRACKS){const rc=records[T.id]||{};txt(T.name,bx+8*u,y,14*u,'left','#fff');txt(fmt(rc.lap),bx+bw-8*u,y,14*u,'right','rgba(255,255,255,.8)');y+=24*u;}
  y+=gap;button(bx,y,bw,bh,'BACK',()=>{G.overlay=null;},{size:17*u});}
 else if(o==='pause'){let y=overlayPanel('PAUSED',hue)+16*u;
  button(bx,y,bw,bh,'RESUME',()=>{G.overlay=null;},{size:17*u});y+=bh+gap;
  button(bx,y,bw,bh,'RESTART',()=>startRace(R.ti),{size:17*u});y+=bh+gap;
  viewRow(bx,y,bw,bh,u);y+=bh+gap;
  button(bx,y,bw,bh,'RETURN TO MENU',()=>{G.state='select';G.overlay=null;},{size:17*u});}
 else if(o==='finish'){const r=R;let y=overlayPanel('FINISH',hue)+18*u;
  if(r.bot){const win=r.place===1,gap=!win&&r.bot.total!=null?'  +'+(r.total-r.bot.total).toFixed(2)+'s':'';txt(win?'YOU BEAT THE BOT':'BOT WINS'+gap,W/2,y,20*u,'center',win?'#ffd23d':'#ff4d6d');y+=30*u;}
 txt('TOTAL  '+fmt(r.total),W/2,y,24*u,'center','#fff');y+=26*u;
  if(r.newTotal){txt('NEW RECORD',W/2,y,14*u,'center','#ffd23d');}y+=24*u;
  const bl=Math.min(...r.laps);txt('BEST LAP  '+fmt(bl)+(r.newLap?'  ★':''),W/2,y,17*u,'center',hsl(hue,100,75));y+=26*u;
  const lt=r.laps.map((l,i)=>'L'+(i+1)+' '+fmt(l)).join('   ');txt(lt,W/2,y,fit(lt,12*u,W-40),'center','rgba(255,255,255,.6)');y+=30*u;
  button(bx,y,bw,bh,'RACE AGAIN',()=>startRace(r.ti),{size:17*u,stroke:hsl(hue,100,62)});y+=bh+gap;
  button(bx,y,bw,bh,'RETURN TO MENU',()=>{G.state='select';G.overlay=null;},{size:17*u});}
 G.drawOv=false;
}
function render(dt){
 ctx.setTransform(DPR,0,0,DPR,0,0);UI.length=0;
 A.pulse=Math.pow(1-((G.t*2)%1),4)*(RM?.3:1);
 ctx.fillStyle='#07040d';ctx.fillRect(0,0,W,H);
 if(G.state==='title')renderTitle();else if(G.state==='select')renderSelect(dt);else if(G.state==='race'&&R)renderRace(dt);
 if(G.overlay)renderOverlay();
 if(G.toast){const u=uiU(),s=14*u,w=tw(G.toast.text,s)+40*u,y=H-INS.b-80*u;ctx.globalAlpha=Math.min(1,G.toast.life*2);slab(W/2-w/2,y-18*u,w,36*u,10*u,'r','rgba(0,0,0,.9)');txt(G.toast.text,W/2+5*u,y,s,'center','#fff');ctx.globalAlpha=1;G.toast.life-=dt;if(G.toast.life<=0)G.toast=null;}
}

// ---------- input ----------
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{
 e.preventDefault();initAudio();try{cv.setPointerCapture(e.pointerId);}catch(_){}
 const x=e.clientX,y=e.clientY;
 for(let i=UI.length-1;i>=0;i--){const b=UI[i];if(G.overlay&&!b.ov)continue;if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){sClick();b.fn();return;}}
 if(G.overlay)return;
 if(G.state==='title'){sClick();goSelect();return;}
 if(G.state==='select'){G.swipe={id:e.pointerId,x0:x,y0:y};return;}
 if(G.state==='race'){if(x<W/2){if(!ptr.left)ptr.left={id:e.pointerId,ox:x,oy:y,x,y};}else if(!ptr.right)ptr.right={id:e.pointerId,x,y};}
});
cv.addEventListener('pointermove',e=>{
 const x=e.clientX,y=e.clientY;
 if(ptr.right&&e.pointerId===ptr.right.id){ptr.right.x=x;ptr.right.y=y;}
});
function release(e){
 if(ptr.left&&e.pointerId===ptr.left.id)ptr.left=null;
 if(ptr.right&&e.pointerId===ptr.right.id)ptr.right=null;
 if(G.swipe&&e.pointerId===G.swipe.id&&G.state==='select'&&!G.overlay){const dx=e.clientX-G.swipe.x0,dy=e.clientY-G.swipe.y0;G.swipe=null;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy))changeSel(dx<0?1:-1);else if(Math.abs(dx)<14&&Math.abs(dy)<14){sClick();tryStart();}}
}
cv.addEventListener('pointerup',release);cv.addEventListener('pointercancel',release);
window.addEventListener('keydown',e=>{
 const k=e.key,kl=k.toLowerCase();if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(kl))e.preventDefault();
 if(e.repeat){keys.add(kl);return;}
 initAudio();keys.add(kl);
 if(kl==='escape'||kl==='p'){if(G.overlay&&G.overlay!=='finish')G.overlay=null;else if(G.state==='race'&&!G.overlay)G.overlay='pause';else if(G.state==='select')G.state='title';return;}
 if(G.overlay){if(G.overlay==='finish'&&kl==='enter')startRace(R.ti);return;}
 if(G.state==='title'&&(kl==='enter'||kl===' '))goSelect();
 else if(G.state==='select'){if(kl==='arrowleft')changeSel(-1);else if(kl==='arrowright')changeSel(1);else if(kl==='enter'||kl===' ')tryStart();}
});
window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
// Android back button (called by the app wrapper): steps back one screen, 'exit' on the title screen
window.__gkBack=()=>{if(G.overlay&&G.overlay!=='finish'){G.overlay=null;return 'ok';}if(G.state==='race'){if(!G.overlay)G.overlay='pause';else{G.state='select';G.overlay=null;}return 'ok';}if(G.state==='select'){G.state='title';return 'ok';}return 'exit';};
window.addEventListener('blur',()=>{keys.clear();ptr.left=ptr.right=null;});
window.__gkPause=()=>{keys.clear();ptr.left=ptr.right=null;if(A.C&&A.C.state==='running')A.C.suspend();if(G.state==='race'&&R&&R.phase!=='finish'&&!G.overlay)G.overlay='pause';};
document.addEventListener('visibilitychange',()=>{if(document.hidden)window.__gkPause();});

// ---------- loop: physics fixed at 120 Hz, drawing at the display rate ----------
let last=performance.now(),acc=0;
function frame(now){
 requestAnimationFrame(frame);
 let dt=(now-last)/1000;last=now;if(dt>.1)dt=.1;if(dt<0)dt=0;G.t+=dt;
 if(G.state==='race'&&R&&(!G.overlay||G.overlay==='finish')){acc+=dt;while(acc>=DT){stepRace(DT);acc-=DT;}G.alpha=acc/DT;if(R.phase==='finish'&&R.fin>1.2&&!G.overlay)G.overlay='finish';}else acc=0;
 if(A.C)engineTick(dt);
 render(dt);
}
requestAnimationFrame(frame);
})();
</script>
